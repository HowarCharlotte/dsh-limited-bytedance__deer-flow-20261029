name: Backend Blocking IO

on:
  push:
    branches: ["main", "2.0.x-dev"]
    paths:
      - "backend/**"
      - ".github/workflows/backend-blocking-io-tests.yml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "backend/**"
      - ".github/workflows/backend-blocking-io-tests.yml"

concurrency:
  group: blocking-io-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend-blocking-io:
    # Draft pull requests are skipped; pushes and non-draft pull requests run.
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Install backend dependencies
        working-directory: backend
        run: uv sync --group dev

      # Runtime regression gate only: exercises the paths reached by the
      # focused tests under backend/tests/blocking_io/. It does not run the
      # static AST detector and is not proof that the whole backend is free
      # of blocking IO.
      - name: Run blocking IO regression tests
        working-directory: backend
        run: make test-blocking-io
